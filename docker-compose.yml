version: '3.8'

services:
  db:
    image: postgres:16
    container_name: ksef_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ksef_user
      POSTGRES_PASSWORD: ksef_password
      POSTGRES_DB: ksef_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: